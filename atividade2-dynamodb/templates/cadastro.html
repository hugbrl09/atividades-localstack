{% extends "base.html" %}
{% block conteudo %}
<h1>Criar conta</h1>
<form method="post">
  <label>Nome <input name="nome" required></label>
  <label>E-mail <input name="email" type="email" required></label>
  <label>Senha <input name="senha" type="password" minlength="6" required></label>
  <label>Confirmar senha <input name="confirmacao" type="password" minlength="6" required></label>
  <button type="submit">Cadastrar</button>
</form>
<p class="rodape">Já tem conta? <a href="{{ url_for('login') }}">Entrar</a></p>
{% endblock %}
