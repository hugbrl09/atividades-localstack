<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Atividade 2 - DynamoDB</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f3f5f8; color: #222; margin: 0; }
    .caixa { max-width: 380px; margin: 56px auto; background: #fff; padding: 28px; border-radius: 10px;
             box-shadow: 0 2px 12px rgba(0,0,0,.08); }
    h1 { font-size: 22px; margin-top: 0; }
    label { display: block; margin-top: 12px; font-size: 14px; color: #444; }
    input { width: 100%; box-sizing: border-box; padding: 9px; margin-top: 4px; border: 1px solid #ccc; border-radius: 6px; }
    button { width: 100%; margin-top: 18px; padding: 10px; border: 0; border-radius: 6px; background: #1f6feb;
             color: #fff; font-size: 15px; cursor: pointer; }
    .msg { padding: 10px 14px; border-radius: 6px; margin-bottom: 12px; font-size: 14px; }
    .ok { background: #e6f4ea; color: #1e6b34; }
    .erro { background: #fdecea; color: #a12622; }
    .rodape { margin-top: 16px; font-size: 14px; text-align: center; }
    dt { font-weight: 600; margin-top: 10px; }
    dd { margin: 2px 0 0; word-break: break-all; color: #444; }
  </style>
</head>
<body>
  <div class="caixa">
    {% for categoria, mensagem in get_flashed_messages(with_categories=true) %}
      <div class="msg {{ categoria }}">{{ mensagem }}</div>
    {% endfor %}
    {% block conteudo %}{% endblock %}
  </div>
</body>
</html>
